name: Verify Fixes

# Every remediation PR must prove it is safe before review: pinned deps
# install cleanly, each fix's tests pass, and a rescan shows act-now
# findings closed with nothing new introduced.
#
# Runs on every PR (no paths filter) because it is a required check: a
# filtered-out required check never reports and blocks the merge forever.
# PRs that don't touch the service pass through the "changes" step.
#
# Also runs on pushes to main: CI Steward only auto-fixes a PR when this
# workflow passed on the PR's base commit, which proves the PR caused the
# failure.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect service changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "push" ]; then
            base="$BEFORE"; range="$BEFORE..HEAD"
          else
            base="origin/$BASE_REF"; range="origin/$BASE_REF...HEAD"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "0000000000000000000000000000000000000000" ] \
             || git diff --quiet "$range" -- sample-app scripts/verify_fixes.py; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes to sample-app; nothing to verify." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the service's pinned Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: sample-app/.python-version

      - name: Install Trivy (pinned, checksum-verified)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Verify fixes
        if: steps.changes.outputs.relevant == 'true'
        run: |
          python scripts/verify_fixes.py \
            --ref HEAD \
            --base "${{ steps.changes.outputs.base }}" \
            --python "$(command -v python)" \
            --out verification.json

      - name: Summarize
        if: always() && steps.changes.outputs.relevant == 'true'
        run: |
          [ -f verification.json ] || { echo "No verification report produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          v = json.load(open("verification.json"))
          g, t, r = v["gate"], v["tests"], v["rescan"]
          print(f"## Fix verification: {'PASSED' if g['passed'] else 'FAILED'}")
          if v["meta"].get("note"):
              print(v["meta"]["note"])
              raise SystemExit(0)
          print(f"Python {v['meta']['python']} · tests {t['passed']}/{t['ran']} passed · "
                f"findings {r['before']} -> {r['after']} · {len(r['introduced'])} introduced\n")
          print("| Package | Change | Tests | Findings closed | Status |")
          print("|---|---|---|---|---|")
          for f in v["fixes"]:
              change = f"{f['from'] or '-'} -> {f['to'] or 'removed'}"
              print(f"| {f['package']} | {change} | {f['tests_passed']}/{f['tests_ran']} | "
                    f"{len(f['findings_closed'])} | {f['status']} |")
          for reason in g["reasons"]:
              print(f"\n- {reason}")
          EOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-verification
          path: verification.json
          if-no-files-found: ignore
